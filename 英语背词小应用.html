  for(let i=0;i<blocks.length;i++){
    const b = blocks[i];
    if(b.type==='row'){
      const e = entryFromCells(b.cells);
      if(e) rows.push(e);
      else if(b.cells.join('').trim() && !isHeaderLine(b.cells.join(' '))) skipped++;
      continue;
    }
    const raw = String(b.text||'').trim();
    if(!raw) continue;
    if(isHeaderLine(raw)) continue;
    const parsed = parseLine(raw);
    if(parsed){ rows.push(parsed); continue; }
    if(isEnglishOnly(raw)){
      let j = i+1;
      while(j<blocks.length && blocks[j].type==='p' && !String(blocks[j].text||'').trim()) j++;
      if(j<blocks.length && blocks[j].type==='p'){
        const next = String(blocks[j].text||'').trim();
        if(next && hasCJK(next) && !/^(unit|lesson|module|chapter)\b/i.test(next)){

          if(e){ rows.push(e); i = j; continue; }

    if(seen.has(key)){ dup++; continue; }

  }
  return {rows:unique, skipped:skipped, dup:dup};

function textToBlocks(text){
  return String(text||'').replace(/\r\n?/g,'\n').split('\n').map(function(line){ return {type:'p', text:line}; });
}

function findEOCD(u8){

  const eocd = findEOCD(u8);
  if(eocd<0) throw new Error('无法识别这个 .docx 文件，请确认文件没有损坏');
  const count = view.getUint16(eocd+10,true);
  let p = view.getUint32(eocd+16,true);
  const entries = {};
  const dec = new TextDecoder('utf-8');
  for(let i=0;i<count;i++){
    if(view.getUint32(p,true)!==0x02014b50) break;
    const method = view.getUint16(p+10,true);
    const compSize = view.getUint32(p+20,true);
    const nameLen = view.getUint16(p+28,true);
    const extraLen = view.getUint16(p+30,true);
    const commentLen = view.getUint16(p+32,true);
    const localOffset = view.getUint32(p+42,true);
    const name = dec.decode(u8.subarray(p+46,p+46+nameLen));
    entries[name] = {method:method, compSize:compSize, localOffset:localOffset};
    p += 46+nameLen+extraLen+commentLen;
  }
  return entries;
}
async function extractZipEntry(buffer, entry){
  const u8 = new Uint8Array(buffer);
  const view = new DataView(buffer);
  const p = entry.localOffset;
  if(view.getUint32(p,true)!==0x04034b50) throw new Error('Word 文档结构异常');
  const nameLen = view.getUint16(p+26,true);
  const extraLen = view.getUint16(p+28,true);
  const start = p+30+nameLen+extraLen;
  const compressed = u8.subarray(start, start+entry.compSize);
  if(entry.method===0) return compressed;
  if(entry.method!==8) throw new Error('Word 文档使用了不支持的压缩格式');
  let inflater;
  try { if(typeof DecompressionStream==='undefined') throw new Error('unsupported'); inflater = new DecompressionStream('deflate-raw'); }
  catch(e) { throw new Error('当前浏览器不支持解析此 Word 文档，请更新系统，或将内容保存为 TXT 后导入'); }
  const stream = new Blob([compressed.slice()]).stream().pipeThrough(inflater);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function paragraphText(p){
  let out = '';
  function walk(node){
    for(const child of node.childNodes){
      if(child.nodeType!==1) continue;
      const ln = child.localName;
      if(ln==='t') out += child.textContent;
      else if(ln==='tab') out += '\t';
      else if(ln==='br'||ln==='cr') out += '\n';
      else if(ln==='p'){ /* nested paragraph is handled separately */ }
      else walk(child);
    }
  }
  walk(p);
  return out.replace(/\u00a0/g,' ').trim();
}
function docxToBlocks(buffer){
  const entries = unzipEntries(buffer);
  const target = entries['word/document.xml'];
  if(!target) throw new Error('这个文件不是有效的 .docx 文档');
  return extractZipEntry(buffer, target).then(function(bytes){
    const xml = new TextDecoder('utf-8').decode(bytes);
    const doc = new DOMParser().parseFromString(xml,'application/xml');
    if(doc.getElementsByTagName('parsererror').length) throw new Error('Word 文档内容解析失败');
    const body = doc.getElementsByTagNameNS('*','body')[0];
    if(!body) throw new Error('Word 文档中没有正文内容');
    const blocks = [];
    function collect(node){
      for(const child of node.children){
        const ln = child.localName;
        if(ln==='p'){
          const t = paragraphText(child);
          if(t) blocks.push({type:'p', text:t});
        }else if(ln==='tbl'){
          for(const tr of child.children){
            if(tr.localName!=='tr') continue;
            const cells = [];
            for(const tc of tr.children){
              if(tc.localName!=='tc') continue;
              let s = '';
              for(const p of tc.getElementsByTagNameNS('*','p')) s += (s?' ':'')+paragraphText(p);
              cells.push(s.trim());
            }
            if(cells.some(function(c){return c;})) blocks.push({type:'row', cells:cells});
          }
        }else if(child.children && child.children.length){
          collect(child);
        }
      }
    }
    collect(body);
    return blocks;
  });
}
function readFileAsArrayBuffer(file){
  return new Promise(function(resolve,reject){
    const r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = function(){ reject(new Error('文件读取失败')); };
    r.readAsArrayBuffer(file);
  });
}
function readFileAsText(file){
  return new Promise(function(resolve,reject){
    const r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = function(){ reject(new Error('文件读取失败')); };
    r.readAsText(file,'utf-8');
  });
}

async function handleImportFile(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  setImportMsg('正在读取「'+esc(file.name)+'」…');
  try{
    let result;
    if(ext==='docx'){
      const buf = await readFileAsArrayBuffer(file);
      const blocks = await docxToBlocks(buf);
      result = entriesFromBlocks(blocks);
    }else if(ext==='txt'||ext==='csv'||ext==='md'){
      const text = await readFileAsText(file);
      result = entriesFromBlocks(textToBlocks(text));
    }else if(ext==='doc'){
      throw new Error('旧版 .doc 无法直接解析，请在 Word 中另存为 .docx 后再导入');
    }else{
      throw new Error('不支持的文件类型，请使用 .docx / .txt / .csv');
    }
    applyImportResult(result, file.name);
  }catch(e){
    setImportMsg('导入失败：'+esc(e.message),'error');
    toast(e.message,'error');
  }
}

function confirmImport(){
  const rows = ui.importRows.filter(function(r){ return String(r.en||'').trim() && String(r.cn||'').trim() && hasCJK(r.cn); });
  if(!rows.length){ toast('没有可导入的有效词条','error'); return; }
  const target = document.querySelector('input[name="importTarget"]:checked');
  const mode = target ? target.value : 'current';
  let lib;
  if(mode==='new'){
    const name = document.getElementById('newLibName').value.trim();
    if(!name){ toast('请填写新词库名称','error'); document.getElementById('newLibName').focus(); return; }
    if(state.libraries.some(function(l){return l.name===name;})){ toast('已存在同名词库','error'); return; }
    lib = {id:uid('lib'), name:name, desc:'从 Word 导入的自定义词库', createdAt:Date.now(), builtin:false, words:[]};
    state.libraries.push(lib);
  }else{
    lib = activeLib();
  }
  const existing = new Set(lib.words.map(function(w){ return normalizeAnswer(w.en); }));
  let added=0, skippedDup=0, invalid=0;
  const newWords = [];
  for(const r of rows){
    const en = String(r.en||'').trim(), cn = String(r.cn||'').trim();
    if(!en || !cn || !/[A-Za-z]/.test(en) || !hasCJK(cn)){ invalid++; continue; }
    const key = normalizeAnswer(en);
    if(existing.has(key)){ skippedDup++; continue; }
    existing.add(key);
    newWords.push({id:uid('w'), en:en, cn:cn, phonetic:String(r.phonetic||'').trim(), example:'', exampleCn:'', libraryId:lib.id});
  }
  if(!newWords.length){
    toast(skippedDup?'这些词都已在词库中，没有新增':'没有可导入的有效词条','error');
    return;
  }
  lib.words = lib.words.concat(newWords);
  if(mode==='new'){ state.activeLibraryId = lib.id; ui.wordPage=1; ui.wordFilter='all'; ui.wordSearch=''; }
  saveState(); closeModal();
  ui.importRows = []; ui.importMeta = null;
  toast('已导入 '+newWords.length+' 个生词'+(skippedDup?'，跳过重复 '+skippedDup+' 个':'')+(invalid?'，忽略无效 '+invalid+' 条':''),'success');
  ui.page='library'; render();
}

function quizRoundFor(libId, scope){

  if(!round) return;

function buildQuestion(word, mode, lib){
  const q = {word:word, mode:mode, answered:false, correct:false, userAnswer:'', hintUsed:false, promptSpoken:false, answerSpoken:false, options:[]};
  if(mode==='en2cn'){
    const seen = new Set([word.cn]);
    const decoys = [];
    const candidates = shuffle(lib.words.filter(function(w){return w.id!==word.id;}));
    for(const w of candidates){
      if(seen.has(w.cn)) continue;
      seen.add(w.cn); decoys.push({text:w.cn, correct:false});
      if(decoys.length>=3) break;
    }
    q.options = shuffle([{text:word.cn, correct:true}].concat(decoys));
  }
  return q;
}

  }
  if(state.settings.shuffle !== false) words = shuffle(words);
  const count = Math.max(1, Math.min(Number(opts.count)||10, words.length));

  const questions = words.map(function(w,i){

function buildHint(en){
  const chars = String(en||'').split('');
  let out = '';
  let firstLetter = true;
  for(const c of chars){
    if(/[A-Za-z]/.test(c)){
      out += firstLetter ? c : '_';
      firstLetter = false;
    }else if(c===' '||c==='-'){
      out += c;
    }
  }
  return out.split('').join(' ')+'  ('+String(en).replace(/[^A-Za-z]/g,'').length+' 个字母)';
}

function finalizeAnswer(q, correct, userAnswer){
  if(q.answered) return;
  const before=JSON.stringify(state);
  const round=ui.quiz.round, completed=round ? round.completed.slice() : null;
  const outcome=recordLearning(q.word, !!correct);
  if(round && !ui.quiz.roundRetry && !round.completed.includes(q.word.id)) round.completed.push(q.word.id);
  saveState();
  if(typeof storageOK!=='undefined' && !storageOK){ state=JSON.parse(before); if(round) round.completed=completed; render(); return; }
  q.answered=true; q.correct=!!correct; q.userAnswer=String(userAnswer||''); q.answeredAt=Date.now();
  ui.quiz.answers.push({wordId:q.word.id, en:q.word.en, cn:q.word.cn, correct:!!correct, userAnswer:q.userAnswer, mode:q.mode});
  q.newError=outcome.newError; q.autoWeak=outcome.autoWeak;
  q.masteredNow=outcome.masteredNow; q.progress=outcome.correctStreak;
  render();
}
function recordLearning(word, correct){
  ensureDaily();
  const s = scoreOf(word.id);
  const hadError = errorEntryOf(word.id) || state.errorBook.find(function(e){return errorKey(e.en) && errorKey(e.en)===errorKey(word.en);}) || null;
  const outcome = {newError:false, autoWeak:false, masteredNow:false, correctStreak:0};
  s.lastSeen = Date.now();
  s.lastResult = correct ? 'correct' : 'wrong';
  if(correct){
    s.right = (Number(s.right)||0)+1;
    s.streak = (Number(s.streak)||0)+1;
  }else{
    s.wrong = (Number(s.wrong)||0)+1;
    s.streak = 0;
    if(s.wrong>=2 && !s.weak){ s.weak = true; s.weakAuto = true; outcome.autoWeak = true; }
  }
  state.daily.count = (Number(state.daily.count)||0)+1;
  if(correct) state.daily.correct = (Number(state.daily.correct)||0)+1;
  touchStudyDay();
  let entry = hadError;
  const previous=masteryOf(word);
  if(!correct && !entry){
    const id=uid('e');
    entry={id:id, wordId:'error:'+id, libraryId:null, en:word.en, cn:word.cn, phonetic:word.phonetic||'', example:word.example||'', exampleCn:word.exampleCn||'', wrongCount:0, correctStreak:0, mastered:false, createdAt:Date.now()};
    state.errorBook.push(entry); outcome.newError=true;
  }
  const progress=setMastery(word, previous+(correct?1:-1));
  outcome.correctStreak=progress; outcome.masteredNow=previous<5 && progress===5;
  if(entry){
    if(correct) entry.lastCorrectAt=Date.now();
    else { entry.wrongCount=(Number(entry.wrongCount)||0)+1; entry.lastWrongAt=Date.now(); }
  }
  return outcome;
}

function finishQuiz(){
  const quiz = ui.quiz;
  if(!quiz || quiz.finished) return;
  clearTimeout(ui.autoNextTimer);
  const total = quiz.questions.length;
  const correct = quiz.answers.filter(function(a){return a.correct;}).length;
  const finishedAt = Date.now();
  const summary = {
    id:uid('s'), mode:quiz.mode, scope:quiz.scope, libId:quiz.libId,
    total:total, correct:correct, accuracy:pct(correct,total),
    startedAt:quiz.startedAt, finishedAt:finishedAt, duration:finishedAt-quiz.startedAt,
    wrong:quiz.answers.filter(function(a){return !a.correct;})
  };
  state.sessions.unshift(summary);
  if(state.sessions.length>20) state.sessions.length = 20;
  quiz.finished = true;
  if(quiz.round && !quiz.roundRetry){
    const completed = new Set(quiz.round.completed);
    quiz.answers.forEach(function(answer){ completed.add(answer.wordId); });
    quiz.round.completed = Array.from(completed);
  }
  quiz.summary = summary;
  saveState();
  render();
}

function speakWord(text){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持语音朗读','error'); return; }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text||''));
    u.lang = 'en-US'; u.rate = .86; u.pitch = 1;
    const voices = window.speechSynthesis.getVoices();
    const en = voices.find(function(v){return /en[-_]US/i.test(v.lang);}) || voices.find(function(v){return /^en/i.test(v.lang);});
    if(en) u.voice = en;
    window.speechSynthesis.speak(u);
  }catch(e){ /* speech is a bonus, never block the quiz */ }
}
// Longer text (a whole sentence) needs a gentler rate; iOS also drops a speak()
// issued in the same tick as cancel(), so the call is deferred slightly.
function speakText(text, rate){
  const value = String(text||'').trim();
  if(!value) return;
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持语音朗读','error'); return; }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(value);
    u.lang = 'en-US'; u.rate = rate || (/[.!?]/.test(value) && value.split(/\s+/).length > 4 ? .88 : .86); u.pitch = 1;
    const voices = window.speechSynthesis.getVoices();

function allErrorWords(){
  const out = [];
  const seen = new Set();
  for(const e of state.errorBook){
    if(e.mastered || seen.has(e.wordId)) continue;
    const w = findWord(e.wordId);
    if(w){ out.push(w); seen.add(e.wordId); }
  }
  return out;
}
function startAllErrors(){
  const libId = '__error_book__', scope = 'errors', mode = 'mixed';
  const words = poolFor(scope, libId);
  if(!words.length){ toast('当前没有待攻克的错题','success'); return; }
  let round = quizRoundFor(libId, scope);
  if(round && !roundRemaining(round).length){
    state.quizRounds = state.quizRounds.filter(function(r){return r!==round;});
    round = null;
  }
  if(!round){ round={mode:mode,scope:scope,libId:libId,completed:[]}; state.quizRounds.push(round); }
  round.mode=mode; round.count=words.length;
  startQuiz({words:roundRemaining(round),mode:mode,scope:scope,count:round.count,libId:libId,round:round});
}
function errorListData(){
  const q = ui.errorSearch.trim().toLowerCase();
  let list = state.errorBook.slice();
  if(ui.errorFilter==='open') list = list.filter(function(e){return !e.mastered;});
  else if(ui.errorFilter==='mastered') list = list.filter(function(e){return e.mastered;});
  if(q) list = list.filter(function(e){ return (e.en||'').toLowerCase().indexOf(q)>=0 || (e.cn||'').indexOf(q)>=0; });
  list.sort(function(a,b){ return (b.lastWrongAt||0)-(a.lastWrongAt||0); });
  return {list:list, q:q};
}

  const counter = win.querySelector('.error-counter');
  if(counter && count) counter.innerHTML = '<b>'+(ui.errorIndex+1)+'</b> / '+count;
  const prev = win.querySelector('[data-action="error-prev"]');
  const next = win.querySelector('[data-action="error-next"]');

function markErrorMastered(wordId){

  const before=JSON.stringify(state), mastered=!e.mastered;

  saveState();
  if(!storageOK){ state=JSON.parse(before); render(); return; }
  render(); toast(mastered?'已移入「已掌握」':'已重新加入「待攻克」','success');
}
function removeError(wordId){
  const e = errorEntryOf(wordId);
  if(!e) return;
  askConfirm({title:'移出错题本？',message:'移出后这个词的错题记录会删除，但学习统计仍会保留。之后再次答错会重新加入。',confirmText:'移出',danger:true}).then(function(ok){

    state.errorBook = state.errorBook.filter(function(x){return x.wordId!==wordId;});

function clearMastered(){
  askConfirm({title:'清空已掌握的错题？',message:'只删除「已掌握」记录，不影响待攻克错题和学习统计。',confirmText:'清空',danger:true}).then(function(ok){

    state.errorBook = state.errorBook.filter(function(e){return !e.mastered;});

  });
}

    '<div class="welcome-body"><div class="welcome-grid">'+
      '<div class="welcome-step"><b><i>1</i>建词库</b><span>用内置示例词库，或导入自己的 Word 词表。</span></div>'+
      '<div class="welcome-step"><b><i>2</i>刷一组</b><span>英译汉 / 汉译英 / 混合，10 题一组即时反馈。</span></div>'+
      '<div class="welcome-step"><b><i>3</i>标薄弱</b><span>点星标记，答错 2 次也会自动标为薄弱词。</span></div>'+
      '<div class="welcome-step"><b><i>4</i>清错题</b><span>答错自动留存，进度达到 5 点移入已掌握。</span></div>'+
    '</div><div class="welcome-note">数据只保存在当前浏览器。建议每周导出一次备份；完整流程、导入格式和复盘方法都在「使用说明」里。</div></div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" data-welcome-guide>查看完整说明</button><button class="btn btn-primary" data-welcome-close>开始使用 '+icon('arrowRight',15)+'</button></div>';
  dlg.showModal();
  dlg.querySelectorAll('[data-welcome-close]').forEach(function(b){ b.onclick=function(){ dismissWelcome(); }; });
  const guideBtn = dlg.querySelector('[data-welcome-guide]');
  if(guideBtn) guideBtn.onclick = function(){ dismissWelcome(); ui.page='guide'; window.scrollTo({top:0,behavior:'smooth'}); render(); };
  dlg.oncancel = function(e){ e.preventDefault(); dismissWelcome(); };

function dismissWelcome(){
  const dlg = document.getElementById('welcomeModal');
  if(dlg && dlg.open) dlg.close();
  if(state.firstRun){ state.firstRun = false; saveState(); }
}
function downloadTemplate(e){
  if(e) e.preventDefault();
  if(TEMPLATE_DOCX_B64.indexOf('__TEMPLATE')===0){ toast('模板文件未打包，请直接在 Word 中按示例格式创建','error'); return; }
  const a = document.createElement('a');
  a.href = 'data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64,'+TEMPLATE_DOCX_B64;
  a.download = '词研-Word导入模板.docx'; document.body.appendChild(a); a.click(); a.remove();
}

/* ============================================================
   EVENTS
   ============================================================ */
let searchTimer = null;
function refocus(id, pos){
  const el = document.getElementById(id);
  if(!el) return;
  el.focus();
  try{ el.setSelectionRange(pos,pos); }catch(e){}
}
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  if(el.disabled) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  if(action==='go'){
    e.preventDefault();
    go(el.dataset.page);
    return;
  }
  if(action==='settings'){ e.preventDefault(); openSettings(); return; }
  if(action==='logout'){ e.preventDefault(); logoutAccount(); return; }
  if(action==='start-quick'){ startQuick(); return; }
  if(action==='setup-mode'){
    ui.setup.mode = el.dataset.mode;
    render(); return;
  }
  if(action==='setup-scope'){
    ui.setup.scope = el.dataset.scope;
    render(); return;
  }
  if(action==='setup-count'){
    ui.setup.count = Number(el.dataset.count);
    render(); return;
  }
  if(action==='quiz-order'){
    state.settings.shuffle = el.dataset.order==='shuffle';
    saveState(); render(); return;
  }
  if(action==='switch-lib'){
    state.activeLibraryId = el.dataset.id;
    ui.wordPage = 1; ui.wordFilter = 'all'; ui.wordSearch = '';
    saveState(); render();
    toast('已切换到「'+activeLib().name+'」');
    return;
  }
  if(action==='new-lib'){ openLibraryDialog(false); return; }
  if(action==='rename-lib'){ openLibraryDialog(true); return; }
  if(action==='add-word'){ openWordDialog(null); return; }
  if(action==='edit-word'){ openWordDialog(id); return; }
  if(action==='delete-word'){ deleteWord(id); return; }
  if(action==='delete-lib'){ deleteLibrary(); return; }
  if(action==='word-filter'){
    ui.wordFilter = el.dataset.filter; ui.wordPage = 1; render(); return;
  }
  if(action==='word-page'){
    ui.wordPage = Number(el.dataset.page); render(); return;
  }
  if(action==='toggle-weak'){
    const weak = toggleWeak(id);
    toast(weak?'已标记为薄弱词':'已取消薄弱标记');
    render(); return;
  }
  if(action==='toggle-weak-quiz'){
    const weak = toggleWeak(id);
    document.querySelectorAll('[data-action="toggle-weak-quiz"][data-id="'+id+'"]').forEach(function(b){
      b.innerHTML = icon('star',14)+(weak?'已标记薄弱':'标记薄弱');
    });
    toast(weak?'已标记为薄弱词':'已取消薄弱标记');
    return;
  }
  if(action==='speak'){
    const w = findWord(id);
    if(w) speakWord(w.en);
    return;
  }
  if(action==='speak-text'){
    speakText(el.dataset.text, Number(el.dataset.rate)||0);
    return;
  }
  if(action==='open-import'){ openImportDialog(); return; }
  if(action==='remove-import-row'){ removeImportRow(Number(el.dataset.idx)); return; }
  if(action==='answer-option'){ answerOption(Number(el.dataset.index)); return; }
  if(action==='reveal-answer'){ revealAnswer(); return; }
  if(action==='show-hint'){ showHint(); return; }
  if(action==='next-question'){ nextQuestion(); return; }
  if(action==='exit-quiz'){ exitQuiz(); return; }
  if(action==='retry-wrong'){ retryWrong(); return; }
  if(action==='next-quiz-group'){ nextQuizGroup(); return; }
  if(action==='restart-quiz-round'){ restartQuizRound(); return; }
  if(action==='error-filter'){
    ui.errorFilter = el.dataset.filter; ui.errorIndex = 0; render(); return;
  }
  if(action==='error-prev'){ moveErrorSlide(-1); return; }
  if(action==='error-next'){ moveErrorSlide(1); return; }
  if(action==='start-errors'){ startAllErrors(); return; }
  if(action==='error-practice'){
    const w = findWord(id);
    if(!w){ toast('该词条已被删除','error'); return; }
    startQuiz({words:[w], mode:'en2cn', scope:'errors', count:1, libId:w.libraryId});
    return;
  }
  if(action==='error-master'){ markErrorMastered(id); return; }
  if(action==='error-remove'){ removeError(id); return; }
  if(action==='clear-mastered'){ clearMastered(); return; }
  if(action==='download-template'){ downloadTemplate(e); return; }
});
document.addEventListener('change', function(e){
  const t = e.target;
  if(t.id==='homeLib'){
    state.activeLibraryId = t.value; saveState(); render(); return;
  }
  if(t.id==='homeCount'){
    ui.setup.count = Number(t.value); render(); return;
  }
  if(t.id==='quizLib'){
    state.activeLibraryId = t.value; saveState(); render(); return;
  }
});
document.addEventListener('input', function(e){
  const t = e.target;
  if(t.id==='wordSearch'){
    const pos = t.selectionStart;
    ui.wordSearch = t.value; ui.wordPage = 1;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ render(); refocus('wordSearch',pos); },180);
    return;
  }
  if(t.id==='errorSearch'){
    const pos = t.selectionStart;
    ui.errorSearch = t.value;
    ui.errorIndex = 0;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ render(); refocus('errorSearch',pos); },180);
  }
});
let errorSwipeStart = null;
document.addEventListener('touchstart', function(e){
  const target = e.target;
  const win = target && target.closest ? target.closest('#error-window') : null;
  if(!win || !e.touches || e.touches.length!==1){ errorSwipeStart = null; return; }
  const t = e.touches[0];
  errorSwipeStart = {x:t.clientX, y:t.clientY};
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(!errorSwipeStart) return;
  const t = e.changedTouches && e.changedTouches[0];
  const start = errorSwipeStart;
  errorSwipeStart = null;
  if(!t) return;
  const dx = t.clientX - start.x;
  const dy = t.clientY - start.y;
  if(Math.abs(dx) < 46 || Math.abs(dx) < Math.abs(dy)*1.4) return;
  moveErrorSlide(dx < 0 ? 1 : -1);
}, {passive:true});
function deleteWord(id){
  const w = findWord(id);
  if(!w) return;
  const lib = getLib(w.libraryId) || activeLib();
  askConfirm({title:'删除「'+esc(w.en)+'」？', message:'会删除这个词及其学习统计，错题本中的独立记录会保留。', confirmText:'删除', danger:true}).then(function(ok){
    if(!ok) return;
    lib.words = lib.words.filter(function(x){return x.id!==id;});
    delete state.stats[id];
    saveState(); render(); toast('已删除「'+w.en+'」');
  });
}
function deleteLibrary(){
  if(state.libraries.length<=1){ toast('至少保留一个词库','error'); return; }
  const lib = activeLib();
  askConfirm({title:'删除词库「'+esc(lib.name)+'」？', message:'词库内的 '+lib.words.length+' 个词及其学习统计会删除，错题本中的独立记录会保留。建议先导出备份。', confirmText:'删除词库', danger:true}).then(function(ok){
    if(!ok) return;
    const ids = new Set(lib.words.map(function(w){return w.id;}));
    state.libraries = state.libraries.filter(function(l){return l.id!==lib.id;});
    ids.forEach(function(wid){ delete state.stats[wid]; });
    state.activeLibraryId = state.libraries[0].id;
    ui.wordPage = 1; ui.wordFilter = 'all'; ui.wordSearch = '';
    saveState(); render(); toast('词库已删除');
  });
}
document.addEventListener('keydown', function(e){
  if(document.getElementById('appModal').open || document.getElementById('welcomeModal').open || document.getElementById('confirmModal').open) return;
  if(ui.page!=='quiz' || !ui.quiz || ui.quiz.finished) return;
  const q = ui.quiz.questions[ui.quiz.idx];
  if(!q) return;
  const tag = (e.target && e.target.tagName) || '';
  const typing = tag==='INPUT' || tag==='TEXTAREA';
  if(e.key==='Escape'){ e.preventDefault(); exitQuiz(); return; }
  if(q.answered){
    if(e.key==='Enter'){ e.preventDefault(); nextQuestion(); }
    return;
  }
  if(q.mode==='en2cn' && /^[1-9]$/.test(e.key) && !typing){
    const i = Number(e.key)-1;
    if(q.options[i]){ e.preventDefault(); answerOption(i); }
    return;
  }
  if(q.mode==='cn2en' && e.key.toLowerCase()==='h' && !typing){
    e.preventDefault(); showHint(); return;
  }
  if(q.mode==='cn2en' && e.key==='Enter' && typing){
    /* the form's submit handler takes care of this */
  }
});
function showHint(){
  const q = ui.quiz && ui.quiz.questions[ui.quiz.idx];
  if(!q || q.answered || q.mode!=='cn2en') return;
  q.hintUsed = true;
  const line = document.getElementById('hintLine');
  if(line) line.innerHTML = '<span class="hint-word">'+esc(buildHint(q.word.en))+'</span><span>首字母 + 字母数提示（已使用）</span>';
  const input = document.getElementById('spellInput');
  if(input) input.focus();
}
document.getElementById('appModal').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});
document.getElementById('appModal').addEventListener('close', function(){
  const dlg = this;
  setTimeout(function(){ if(!dlg.open) dlg.innerHTML=''; },60);
});
document.getElementById('welcomeModal').addEventListener('click', function(e){
  if(e.target===this) dismissWelcome();
});
document.getElementById('confirmModal').addEventListener('click', function(e){
  if(e.target===this){ try{this.close();}catch(err){} }
});
